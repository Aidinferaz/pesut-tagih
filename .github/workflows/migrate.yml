name: Migrate production database

# Applies new migrations in supabase/migrations to the production project.
# Runs after CI passes on main, behind the "production" environment so a
# reviewer has to approve (Settings → Environments → production).
#
# It connects with the database's session-pooler connection string only, so
# no Supabase Management API token is stored anywhere.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret (Supabase → Connect → Session pooler URI) before migrating."
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL"
